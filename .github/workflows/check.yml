name: check

on:
  push:
  pull_request:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reference answers match detectability 0.3.0
        run: python scenarios.py --check
      - name: Pilot scores from the stored results
        run: python run_pilot.py --report
